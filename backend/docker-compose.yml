version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cognivia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cognivia_db
      POSTGRES_USER: cognivia_user
      POSTGRES_PASSWORD: cognivia_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognivia_user -d cognivia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognivia_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DATABASE_URL=postgresql+psycopg://cognivia_user:cognivia_pass@db:5432/cognivia_db
      - JWT_SECRET_KEY=cognivia-production-super-secret-key-change-in-real-prod
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - CORS_ALLOWED_ORIGINS=["*"]
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
